name = "solar-dashboard-backend"
main = "src/index.ts"
compatibility_date = "2024-03-20"

[vars]
ADAFRUIT_USERNAME = "giuspo"
ADAFRUIT_FEED = "solar-data-logger"
FRONTEND_ORIGIN = "https://spog-solar-monitor-box.pages.dev"

# IMPORTANTE: NON inserire mai password, API Key o Client ID in chiaro in questo file o nel codice sorgente.
# Tutte le chiavi segrete vengono lette a runtime dalle variabili d'ambiente cifrate di Cloudflare (c.env).
# Configurale tramite Wrangler CLI (`npx wrangler secret put <NOME_VARIABILE>`):
# - AUTH_SECRET
# - ESP32_API_KEY
# - GOOGLE_CLIENT_ID
# - ADAFRUIT_AIO_KEY


[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "solar-db"
database_id = "bd35fbfe-9bec-4faa-bc8f-6c5f7da845cc"
