# ESPHome WiFi Test Project
esphome:
  name: wifi-test
  friendly_name: WiFi Test

packages:
  adafruit_config: !include config.yaml

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG
  logs:
    ADAFRUIT: DEBUG

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "WiFi-Test Fallback"
    password: !secret fallback_password

captive_portal:

# ABILITIAMO LE RICHIESTE HTTP
http_request:
  timeout: 10s

# I SENSORI TORNANO AD ESSERE PURAMENTE LOCALI
sensor:
  - platform: wifi_signal
    name: "WiFi Signal Strength"
    id: rssi_signal
    update_interval: 5s
    unit_of_measurement: "dBm"
    accuracy_decimals: 0

  - platform: ina219
    address: 0x41
    shunt_resistance: 0.1
    bus_voltage:
      name: "Tensione Pannello"
      id: panel_voltage
    current:
      name: "Corrente Pannello"
      id: panel_current
    power:
      name: "Potenza Pannello"
      id: panel_power
    update_interval: 30s

# Configurazione I2C per INA219
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 400kHz

status_led:
  pin: GPIO2 

web_server:
  port: 80
  version: 2

# Sincronizzazione orario
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Rome
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - lambda: |-
              ESP_LOGI("SNTP", "Orario sincronizzato: %lld (firmware v2.2)", (long long)id(sntp_time).now().timestamp);

# Script per inviare dati ad Adafruit con controllo SNTP
script:
  - id: send_to_adafruit
    then:
      - lambda: |-
          auto now_obj = id(sntp_time).now();
          if(!now_obj.is_valid() || now_obj.timestamp < 1000000000)
          {
            ESP_LOGW("ADAFRUIT", "SNTP non sincronizzato, skip invio dati");
            return;
          }
          id(do_send).execute();

  - id: do_send
    mode: queued
    then:
      - http_request.post:
          url: ${adafruit_full_url}
          request_headers:
            X-AIO-Key: !secret adafruit_aio_key
            Content-Type: "application/json"
          body: !lambda |-
            auto now_obj = id(sntp_time).now();
            time_t now = now_obj.timestamp;

            float v_f = -1.0f;
            float i_f = -1.0f;
            float w_f = -1.0f;
            int rssi_i = -1;
            bool valid = true;

            if(id(panel_voltage).has_state())
            {
              v_f = id(panel_voltage).state;
              if(std::isnan(v_f))
              {
                v_f = -1.0f;
                valid = false;
              }
            }
            else
            {
              valid = false;
            }

            if(id(panel_current).has_state())
            {
              i_f = id(panel_current).state;
              if(std::isnan(i_f))
              {
                i_f = -1.0f;
                valid = false;
              }
            }
            else
            {
              valid = false;
            }

            if(id(panel_power).has_state())
            {
              w_f = id(panel_power).state;
              if (std::isnan(w_f)) { w_f = -1.0f; valid = false; }
            }
            else
            {
              valid = false;
            }

            if(id(rssi_signal).has_state())
            {
              rssi_i = (int)id(rssi_signal).state;
            }
            else
            {
              valid = false;
            }

            char v_str[10], i_str[10], w_str[10];
            snprintf(v_str, sizeof(v_str), "%.2f", v_f);
            snprintf(i_str, sizeof(i_str), "%.2f", i_f);
            snprintf(w_str, sizeof(w_str), "%.2f", w_f);

            char json_buffer[512];
            snprintf(json_buffer, sizeof(json_buffer),
              "{\"value\":\"{\\\"tstamp\\\":%lld,\\\"v_pan\\\":%s,\\\"i_pan\\\":%s,\\\"w_pan\\\":%s,\\\"rssi\\\":%d,\\\"valid\\\":%s}\"}",
              (long long)now,
              v_str,
              i_str,
              w_str,
              rssi_i,
              valid ? "true" : "false");

            ESP_LOGI("ADAFRUIT", "Body inviato: %s", json_buffer);
            return std::string(json_buffer);

# Invia dati ogni 30 secondi
interval:
  - interval: 30s
    then:
      - script.execute: send_to_adafruit
