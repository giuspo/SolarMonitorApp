# ==============================================================================
# Solar Monitor Box - Configurazione Generale (Non-Secret)
# ==============================================================================
# Tutti i parametri hardware, pin, intervalli ed endpoint non sensibili.
# I dati riservati (credenziali, password, chiavi API) risiedono in secrets.yaml.

substitutions:
  # ----------------------------------------------------------------------------
  # 0. Versione Firmware (major.minor.compile)
  # ----------------------------------------------------------------------------
  firmware_version: "1.0.5"

  # ----------------------------------------------------------------------------
  # 1. Carico PWM (MOSFET & Striscia LED)
  # ----------------------------------------------------------------------------
  load_pwm_pin: "GPIO5"
  load_pwm_frequency: "1000Hz"

  # ----------------------------------------------------------------------------
  # 2. Pin Hardware LED di Stato
  # ----------------------------------------------------------------------------
  wifi_status_led_pin: "GPIO27"
  adafruit_status_led_pin: "GPIO4"

  # ----------------------------------------------------------------------------
  # 3. Bus I2C Sensori INA226 & BME680 (Pannello e Batteria)
  # ----------------------------------------------------------------------------
  i2c_solar_sda_pin: "GPIO21"
  i2c_solar_scl_pin: "GPIO22"
  i2c_battery_sda_pin: "GPIO18"
  i2c_battery_scl_pin: "GPIO19"
  i2c_bus_frequency: "400kHz"

  # ----------------------------------------------------------------------------
  # 4. Intervalli di Campionamento e Invio Telemetria
  # ----------------------------------------------------------------------------
  sensor_update_interval: "30s"
  wifi_rssi_interval: "5s"
  adafruit_send_interval: "10min"
  location_update_interval: "30min"

  # ----------------------------------------------------------------------------
  # 5. Rete Wi-Fi (AP di Fallback) & Sistema
  # ----------------------------------------------------------------------------
  fallback_ap_ssid: "WiFi-Test Fallback"
  web_server_port: "80"
  timezone: "Europe/Rome"

  # ----------------------------------------------------------------------------
  # 6. Endpoint Adafruit IO
  # ----------------------------------------------------------------------------
  adafruit_full_url: "https://io.adafruit.com/api/v2/giuspo/feeds/solar-data-logger/data"

  # Soglie massime di validità per sensori (evita falsi scarti durante carica LiFePO4)
  battery_voltage_max: "16.0"
  panel_voltage_max: "60.0"

  # ----------------------------------------------------------------------------
  # 7. Simulatore Carico Smart & Salvaguardia Batteria (Default Runtime)
  # ----------------------------------------------------------------------------
  smart_load_update_interval: "30s"
  smart_adaptive_default: "true"
  led_voltage_limit_default: "true"
  led_target_voltage_default: "12.0"
  cutoff_voltage_default: "12.60"
  recovery_voltage_default: "12.90"
  pwm_night_default: "5"
  pwm_morning_default: "25"
  pwm_day_default: "20"
  pwm_evening_default: "80"
  pwm_late_default: "15"
